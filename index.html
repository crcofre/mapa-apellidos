<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Apellidos - Chile</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height:100%; margin:0; }
    #map { width:100%; height:100vh; background:#f7f7f7; }
    .leaflet-tooltip{
      font-family:"Book Antiqua",serif; font-size:13px; font-weight:bold;
      color:#000; background:rgba(255,255,255,.9);
      border:1px solid rgba(0,0,0,.2); border-radius:4px; padding:3px 6px;
    }

    /* Panel buscador (arriba-derecha ✅) */
    .search-ui{
      position:absolute; top:12px; right:12px; z-index:1000;
      background:#ffffffeb; border:1px solid #ddd; border-radius:10px; padding:10px 12px;
      box-shadow:0 6px 16px rgba(0,0,0,.08);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      max-width:min(92vw,480px);
    }
    .search-ui h3{ margin:0 0 6px 0; font-size:14px; font-weight:700; text-align:right; }
    .search-ui .row{ display:flex; gap:6px; margin-bottom:6px; }
    .search-ui input{ flex:1; padding:6px 8px; font-size:14px; border:1px solid #ccc; border-radius:8px; }
    .search-ui button{ padding:6px 10px; border:0; border-radius:8px; cursor:pointer; font-weight:600; background:#0b5ed7; color:#fff; }
    .search-ui small{ display:block; margin-top:4px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }

    /* Selector de nivel (radios) */
    .option-box{ margin-top:6px; padding:8px 10px; border:1px solid #ddd; border-radius:10px; background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,.05) inset; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .option-box .option-title{ font-size:12px; font-weight:700; color:#333; margin-right:6px; }
    .option-box .opt{ display:flex; align-items:center; gap:6px; padding:2px 6px; border-radius:8px; background:#f7f7f9; border:1px solid #ececf0; cursor:pointer; user-select:none; }
    .option-box .opt input{ accent-color:#0b5ed7; }

    /* Leyenda */
    .legend{ line-height:16px; color:#333; background:#fff; padding:8px 10px; border-radius:8px; border:1px solid #ddd; box-shadow:0 6px 16px rgba(0,0,0,.08);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:12px; }
    .legend .item{ display:flex; align-items:center; gap:6px; }
    .legend .swatch{ width:18px; height:12px; border:1px solid #999; }
    .legend b{ display:block; margin-bottom:4px; }

    /* Logs (ocultos) */
    .log-panel{ display:none !important; }

   /* La lista de sugerencias justo bajo el panel, a la derecha */
.suggest{
  position:absolute; z-index:1001;
  right:12px; left:auto; top:72px;
  background:#fff; border:1px solid #ddd; border-radius:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.15);
  max-height:260px; overflow:auto; width:min(92vw,480px);
}
.suggest.hide{ display:none; }


    /* Ocultar controles de zoom y botón Buscar */
    .leaflet-control-zoom{ display:none !important; }
    #buscarBtn{ display:none !important; }

    /* Botonera CTA (Estudio Genealógico y Diploma) */
    .cta-box{
      background:#fff; border:1px solid #ddd; border-radius:10px; padding:8px; margin-bottom:8px;
      box-shadow:0 6px 16px rgba(0,0,0,.08); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .cta-box a{
      display:block; text-decoration:none; padding:8px 10px; border-radius:8px; margin-bottom:8px; text-align:center;
      font-weight:600;
    }
    .cta-box a:first-child{ background:#0b5ed7; color:#fff; }
    .cta-box a:last-child{ border:1px solid #ccc; color:#111; background:#fff; }
    .cta-box a:last-child:hover{ background:#f7f7f9; }
  </style>
</head>
<body>
  <!-- Panel “Consulta tu apellido” (arriba-derecha ✅) -->
  <div class="search-ui">
    <h3>Consulta tu apellido</h3>
    <div class="row">
      <input id="apellidoInput" type="text" placeholder="Ej.: Cisternas / Díaz / Di Bella" autocomplete="off" />
      <button id="buscarBtn">Buscar</button>
    </div>
    <small id="estado">Cargando mapas…</small>
  </div>

  <div id="suggestBox" class="suggest hide"></div>
  <div class="log-panel"><header>Logs</header><pre id="logText">[init] esperando…</pre></div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- === Scripts del mapa === -->
  <script>
    /* ===== Logger + errores globales ===== */
    const $log=document.getElementById('logText');
    const log=(msg,level='dim')=>{
      const ts=new Date().toISOString().substring(11,19);
      if($log){$log.insertAdjacentText('beforeend',`\n[${ts}] ${msg}`);$log.scrollTop=$log.scrollHeight;}
      console.log(msg);
    };
    const setText=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};

    /* ===== Mapa ===== */
    const map=L.map('map',{center:[-35.6751,-71.5430],zoom:5,minZoom:4,maxZoom:12});
    map.createPane('pane-regiones');map.createPane('pane-provincias');map.createPane('pane-comunas');
    const styleBase={color:"#666",weight:1,fillColor:"#ddd",fillOpacity:.6};
    let regionesGeo=null,provinciasGeo=null,comunasGeo=null;
    const regionesLayer=L.layerGroup(),provinciasLayer=L.layerGroup(),comunasLayer=L.layerGroup();
    const getProp=(p,keys,def="—")=>{for(const k of keys){if(p&&p[k]!=null&&p[k]!=="")return p[k];}return def;};

    (async function loadGeo(){
      try{
        const reg=await fetch('regiones.json',{cache:'no-cache'}).then(r=>r.json());
        const prov=await fetch('provincias.json',{cache:'no-cache'}).then(r=>r.json());
        const com=await fetch('comunas.json',{cache:'no-cache'}).then(r=>r.json());
        regionesGeo=L.geoJSON(reg,{pane:'pane-regiones',style:f=>({...styleBase,color:"#587fbf",weight:1})});
        provinciasGeo=L.geoJSON(prov,{pane:'pane-provincias',style:f=>({...styleBase,color:"#333",weight:1})});
        comunasGeo=L.geoJSON(com,{pane:'pane-comunas',style:f=>({...styleBase,color:"#990000",weight:.8})});
        updateVisibility();
        setText('estado','Listo. Escribe un apellido.');
      }catch(err){setText('estado','Error cargando mapas.');}
    })();

    /* ===== Paletas / bins ===== */
    const PALETAS={region:["#d7ebff","#badaff","#9cc9ff","#7fb8ff","#62a7ff","#458fff","#2a73e0"],provincia:["#e2f7ee","#c6efdc","#a9e6c9","#8cddb7","#6fc5a0","#4fae85","#2f956b"],comuna:["#fde6e9","#fdc9cf","#fdaaae","#fb8b8d","#f25f63","#d84349","#a92d31","#6d171b"]};
    const BINS_BY_LEVEL={region:[0,0.05,0.10,0.20,0.40,0.80,1.50,Infinity],provincia:[0,0.10,0.20,0.40,0.80,1.20,2.00,Infinity],comuna:[0,0.15,0.30,0.60,1.00,1.50,2.50,4.50,Infinity]};
    const colorByBins=(v,pal,bins)=>{if(v==null||isNaN(v))return pal[0];for(let i=0;i<bins.length-1;i++){if(v>=bins[i]&&v<bins[i+1])return pal[i];}return pal[pal.length-1];};
    const labelsFromBins=bins=>{const fmt=x=>(x===Infinity)?"∞":`${(+x).toLocaleString('es-CL',{maximumFractionDigits:2})}%`;const labs=[];for(let i=0;i<bins.length-1;i++){const a=bins[i],b=bins[i+1];labs.push(b===Infinity?`>${fmt(a)}`:`${fmt(a)}–${fmt(b)}`);}return labs;};
    const norm=s=>{if(!s)return"";let t=String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase();t=t.replace(/^\s*\d+\s*[\.\-]?\s*/,"").replace(/^(REGION|PROVINCIA|DEPARTAMENTO)\s+(DEL\s+|DE\s+)?/,"").replace(/^(DEL|DE)\s+/,"");return t.trim();};
    const slugify=s=>(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’'´`]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-");

    let apellidoActual="",nivelMode='auto',nivelActual='region',indice={region:{},provincia:{},comuna:{}};
    function computeNivelByZoom(z){return(z<=6)?'region':(z<=7)?'provincia':'comuna';}

    function actualizarPintado(){
      const pal=PALETAS[nivelActual],bins=BINS_BY_LEVEL[nivelActual];
      const pintar=(geo,nivel)=>{if(!geo)return;geo.eachLayer(l=>{const p=l.feature.properties||{};const key=(nivel==="region")?norm(getProp(p,["REGION","NOM_REG","Región","NAME_1"],"")):(nivel==="provincia")?norm(getProp(p,["PROVINCIA","NOM_PROV","Provincia","NAME_2","name"],"")):norm(getProp(p,["COMUNA","NOM_COM","Comuna","name"],""));const v=(indice[nivel]||{})[key];const fill=colorByBins(v,pal,bins);l.setStyle({fillColor:fill,fillOpacity:.65});});};
      if(nivelActual==="region")pintar(regionesGeo,"region");if(nivelActual==="provincia")pintar(provinciasGeo,"provincia");if(nivelActual==="comuna")pintar(comunasGeo,"comuna");
      legend.update();
      const nombresNivel={region:'región',provincia:'provincia',comuna:'comuna'};
      setText('estado',`Mostrando "${apellidoActual||'—'}" – vista de ${nombresNivel[nivelActual]||nivelActual}`);
    }

    function updateVisibility(){
      const targetNivel=(nivelMode==='auto')?computeNivelByZoom(map.getZoom()):nivelActual;
      regionesLayer.clearLayers();provinciasLayer.clearLayers();comunasLayer.clearLayers();
      if(map.hasLayer(regionesLayer))map.removeLayer(regionesLayer);
      if(map.hasLayer(provinciasLayer))map.removeLayer(provinciasLayer);
      if(map.hasLayer(comunasLayer))map.removeLayer(comunasLayer);
      if(targetNivel==='region'){if(regionesGeo){regionesLayer.addLayer(regionesGeo);regionesLayer.addTo(map);}}
      else if(targetNivel==='provincia'){if(provinciasGeo){provinciasLayer.addLayer(provinciasGeo);provinciasLayer.addTo(map);}}
      else{if(comunasGeo){comunasLayer.addLayer(comunasGeo);comunasLayer.addTo(map);}}
      nivelActual=targetNivel;actualizarPintado();
    }

    const legend=L.control({position:'bottomright'});
    legend.onAdd=function(){this._div=L.DomUtil.create('div','legend');this.update();return this._div;};
    legend.update=function(){const pal=PALETAS[nivelActual],bins=BINS_BY_LEVEL[nivelActual],labs=labelsFromBins(bins);let html=`<b>Frecuencia (%)</b><br>`;for(let i=0;i<labs.length;i++){html+=`<div class="item"><span class="swatch" style="background:${pal[i]}"></span>${labs[i]}</div>`;}this._div.innerHTML=html;};
    legend.addTo(map);

    /* === Inserta los botones y control de nivel === */
    (function mountLevelAndCtas(){
      const corner=document.querySelector('.leaflet-bottom.leaflet-right');
      if(!corner){setTimeout(mountLevelAndCtas,100);return;}
      const cta=document.createElement('div');
      cta.className='leaflet-control';
      cta.innerHTML=`
        <div class="cta-box">
          <a href="https://www.apellidos.cl/investigacion-genealogica" target="_blank" rel="noopener">Estudio Genealógico</a>
          <a href="https://www.apellidos.cl/diploma" target="_blank" rel="noopener">Diploma del Apellido</a>
        </div>`;
      corner.appendChild(cta);
      const nivelBox=document.createElement('div');
      nivelBox.className='leaflet-control';
      nivelBox.innerHTML=`
        <div class="option-box" id="nivelBox">
          <div class="option-title">Nivel de visualización</div>
          <label class="opt"><input type="radio" name="nivel" value="auto" checked> Auto</label>
          <label class="opt"><input type="radio" name="nivel" value="region"> Región</label>
          <label class="opt"><input type="radio" name="nivel" value="provincia"> Provincia</label>
          <label class="opt"><input type="radio" name="nivel" value="comuna"> Comuna</label>
        </div>`;
      corner.appendChild(nivelBox);
      nivelBox.addEventListener('change',e=>{
        const t=e.target;
        if(t&&t.name==='nivel'){const v=t.value;
          if(v==='auto'){nivelMode='auto';}else{nivelMode='manual';nivelActual=v;}
          updateVisibility();
        }
      });
    })();

    /* === Buscar apellido === */
    const $input=document.getElementById('apellidoInput');
    const $sbox=document.getElementById('suggestBox');
    function hideSuggest(){$sbox.classList.add('hide');$sbox.innerHTML='';}
    function showSuggest(items){if(!items.length){hideSuggest();return;}$sbox.innerHTML=items.map(t=>`<div class="item" data-v="${t}">${t}</div>`).join('');$sbox.classList.remove('hide');}
    $sbox.addEventListener('click',e=>{const item=e.target.closest('.item');if(!item)return;$input.value=item.getAttribute('data-v');hideSuggest();});

    // --- SUGERENCIAS DE APELLIDOS (autocompletar) ---
const pretty = s => s.replace(/-/g,' ').toUpperCase();

let manifestKeys = null;
async function ensureManifestKeys(){
  if (manifestKeys) return manifestKeys;
  const m = await getApellidosManifest();        // ya existe en tu código
  manifestKeys = Object.keys(m);
  return manifestKeys;
}

function hideSuggest(){
  $sbox.classList.add('hide');
  $sbox.innerHTML = '';
}

function showSuggest(items){
  if (!items.length){ hideSuggest(); return; }
  $sbox.innerHTML = items.map(t=>`<div class="item" data-v="${t}">${t}</div>`).join('');
  $sbox.classList.remove('hide');
}

// Al escribir, mostrar sugerencias
$input.addEventListener('input', async () => {
  const q = slugify($input.value);               // ya tienes slugify
  if (q.length < 2){ hideSuggest(); return; }
  try{
    const keys = await ensureManifestKeys();
    const matches = [];
    for (const k of keys){
      if (k.startsWith(q)){ matches.push(k); if (matches.length >= 50) break; }
    }
    showSuggest(matches.map(pretty));
  } catch(e){ /* silencioso */ }
});

// Click en una sugerencia => completa y busca
$sbox.addEventListener('click', (e)=>{
  const item = e.target.closest('.item');
  if (!item) return;
  $input.value = item.getAttribute('data-v');
  hideSuggest();
  // Si quieres que además cargue de inmediato:
  if (typeof buscarApellido === 'function') buscarApellido();
});

// Enter en el input => buscar (y ocultar lista)
$input.addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){
    hideSuggest();
    if (typeof buscarApellido === 'function') buscarApellido();
  }
});

  </script>
</body>
</html>
