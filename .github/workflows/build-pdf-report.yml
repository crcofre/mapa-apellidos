name: Build PDF Report

on:
  repository_dispatch:
    types: [build_pdf_report]
  workflow_dispatch:
    inputs:
      slug:
        description: "Apellido slug (ej: lucero)"
        required: true
        default: "lucero"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
    
      - name: Check script syntax
        run: node --check scripts/build_pdf_report.mjs

      
      - name: Build report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/build_pdf_report.mjs --slug "${{ inputs.slug }}"
          else
            node scripts/build_pdf_report.mjs --slug "${{ github.event.client_payload.slug }}"
          fi

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pdf_reports/*.html pdf_maps/*.png || true
          git commit -m "Generate pdf report" || echo "No changes"
          git push
