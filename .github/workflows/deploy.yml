name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 1) Crear carpeta de publicación MINIMA
      - name: Prepare site (minimal)
        run: |
          rm -rf _site
          mkdir -p _site

          # Copia lo esencial del sitio (ajusta según tu repo)
          cp -R index.html _site/ 2>/dev/null || true
          cp -R assets _site/ 2>/dev/null || true
          cp -R css _site/ 2>/dev/null || true
          cp -R js _site/ 2>/dev/null || true
          cp -R data _site/ 2>/dev/null || true

          # Copia SOLO lo necesario para el PDF pipeline
          mkdir -p _site/pdf_reports _site/pdf_maps
          cp -R pdf_reports/* _site/pdf_reports/ 2>/dev/null || true
          cp -R pdf_maps/* _site/pdf_maps/ 2>/dev/null || true

          # Si tus shards se consultan desde el front, decide qué carpetas realmente van.
          # EJEMPLO: NO copies pdf_summaries si no se usa en el front.
          # cp -R pdf_summaries _site/  # solo si realmente lo necesitas público

      # 2) Subir solo _site como artifact de Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
