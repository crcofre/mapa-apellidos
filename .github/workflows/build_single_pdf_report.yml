name: Build single PDF report (Python)

on:
  repository_dispatch:
    types: [build_pdf_report]
  workflow_dispatch:
    inputs:
      surname:
        description: "Apellido (ej: Mancilla). Se slugifica solo."
        required: true
        default: "Mancilla"
      request_id:
        description: "ID único de la solicitud (ej: 20260114153000123)."
        required: false
        default: ""

permissions:
  contents: write

# Un grupo de concurrencia ÚNICO por solicitud: las solicitudes corren en
# paralelo y NO se cancelan entre sí (esto era lo que rompía la generación).
concurrency:
  group: build-pdf-${{ github.event.client_payload.request_id || github.event.inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (cairo + fuente)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: pip install --no-cache-dir cairosvg pymupdf pillow

      - name: Generar PDF del informe
        env:
          SURNAME: ${{ github.event_name == 'workflow_dispatch' && inputs.surname || (github.event.client_payload.surname || github.event.client_payload.slug) }}
          REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.event.client_payload.request_id }}
        run: |
          set -e
          echo "Generando informe para: $SURNAME (request_id=$REQUEST_ID)"
          REPO_ROOT="." python scripts/gen_pdf.py --surname "$SURNAME" --request_id "$REQUEST_ID"

      # Commit + push con reintentos SOLO del push. Cada solicitud escribe
      # archivos distintos (requests/<id>.json es único), así el rebase resuelve
      # sin conflicto cuando otra ejecución empujó antes.
      - name: Commit & push (rebase retry)
        env:
          SURNAME: ${{ github.event_name == 'workflow_dispatch' && inputs.surname || (github.event.client_payload.surname || github.event.client_payload.slug) }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf_reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "informe PDF ${SURNAME}"
          for i in 1 2 3 4 5 6 7 8; do
            echo "Push attempt $i"
            if git push origin HEAD:main; then echo "Push OK"; exit 0; fi
            echo "Push rechazado (main avanzo). Rebase y reintento..."
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 3
          done
          echo "Push fallo tras reintentos"; exit 1
