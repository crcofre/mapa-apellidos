name: Build single PDF report (HTML + PNG)

on:
  repository_dispatch:
    types: [build_pdf_report]
  workflow_dispatch:
    inputs:
      slug:
        description: "Apellido slug (ej: lucero) [compatibilidad]"
        required: true
        default: "lucero"
      surname:
        description: "Apellido crudo (ej: Santa Maria). Si se define, se usa con request_id."
        required: false
        default: ""
      request_id:
        description: "ID único (ej: 20260114153000123). Requerido si usas surname."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-pdf-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build + Commit + Push (retry)
        env:
          # Compatibilidad (modo antiguo)
          SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || github.event.client_payload.slug }}

          # Modo nuevo (Opción A)
          SURNAME: ${{ github.event_name == 'workflow_dispatch' && inputs.surname || github.event.client_payload.surname }}
          REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.event.client_payload.request_id }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "Attempt $i: syncing with origin/main"
            git fetch origin main
            git reset --hard origin/main

            # --- Ejecución: modo nuevo si viene surname + request_id ---
            if [ -n "$SURNAME" ] && [ -n "$REQUEST_ID" ]; then
              echo "Building report for surname=$SURNAME (request_id=$REQUEST_ID)"
              node scripts/build_pdf_report.mjs --surname "$SURNAME" --request_id "$REQUEST_ID"
            else
              echo "Building report for slug=$SLUG"
              node scripts/build_pdf_report.mjs --slug "$SLUG"
            fi

            git add pdf_reports pdf_maps

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "build pdf report ${SLUG:-$SURNAME}"

            echo "Pushing..."
            if git push origin HEAD:main; then
              echo "Push OK"
              exit 0
            fi

            echo "Push rejected (main advanced). Retrying..."
            sleep 3
          done

          echo "Push failed after retries"
          exit 1
